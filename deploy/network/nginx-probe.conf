# nginx 反向代理 —— WebSocket 延迟探针（节点机 gz / sz 通用）
#
# 部署路径: /etc/nginx/conf.d/probe.conf
# 部署前必须替换: <NODE_DOMAIN> -> gz.mcwok.cn（广州机）或 sz.mcwok.cn（深圳机）
#
# 数据路径:
#   浏览器 --wss--> 节点:443 nginx --http/1.1--> 节点:127.0.0.1:25610 (frps 暴露)
#         --frp 隧道--> 家里:25610 (mod 内置探针)
#
# ============================================================================
# 必读: frps 的 25610 必须用防火墙锁死到本机
# ============================================================================
# frps 把 remotePort 绑在 bindAddr（0.0.0.0）上，所以 25610 默认是裸奔在公网的，
# 任何人都能绕开 nginx 直连 <节点IP>:25610 打探针。
# 不能靠 frps 的 proxyBindAddr = "127.0.0.1" 解决 —— 那个设置对所有 proxy
# 一起生效，会把 25565 也绑到回环上，玩家直接进不来。
# 正确做法是在节点上放行 443、拦掉 25610（同时记得云厂商安全组也要一致）:
#
#   firewalld:
#     firewall-cmd --permanent --add-port=443/tcp
#     firewall-cmd --permanent --add-rich-rule='rule family=ipv4 source address=127.0.0.1/32 port port=25610 protocol=tcp accept'
#     firewall-cmd --permanent --add-rich-rule='rule family=ipv4 port port=25610 protocol=tcp drop'
#     firewall-cmd --reload
#
#   ufw（ufw 默认拒绝入站，只要不 allow 25610 即可，无需显式 deny）:
#     ufw allow 443/tcp
#     ufw allow 25565/tcp
#     ufw allow 7000/tcp
#
# 阿里云安全组 / 腾讯云安全组里同样只放行 443、25565、7000，
# 不要放行 25610 和 7500。
# ============================================================================

# WebSocket 升级需要把 Connection 头改写成 upgrade，但普通请求要保持 close，
# 直接写死 "Connection: upgrade" 会破坏非 WS 的 keepalive。
# 变量名带 probe_ 前缀是为了不和节点上已有站点（比如面板 vhost）里同名的
# $connection_upgrade map 撞车 —— nginx 里重复定义同名 map 会直接拒绝启动。
map $http_upgrade $probe_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # 刻意不开 HTTP/2: 这个 vhost 只服务 WebSocket，浏览器发起 WS 时一律
    # 回落到 HTTP/1.1 的 Upgrade 握手，h2 在这里没有任何收益，
    # 反而要求 nginx >= 1.25.1 才能用 "http2 on;" 语法，徒增版本兼容风险。

    server_name <NODE_DOMAIN>;

    # 泛域名证书由 issue-wildcard-cert.sh 签发并安装到这两个路径。
    # 换路径的话记得同步改那个脚本里的 --install-cert 参数。
    ssl_certificate     /etc/nginx/ssl/mcwok.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mcwok.cn/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:PROBE_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location /probe {
        proxy_pass http://127.0.0.1:25610;

        # 以下四行缺一不可，少任何一行 WebSocket 握手都会失败:
        # nginx 默认用 HTTP/1.0 回源，而 Upgrade 机制是 HTTP/1.1 才有的。
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $probe_connection_upgrade;
        proxy_set_header Host       $host;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 探针连接是长连接，两次心跳之间可能长时间没有字节流动。
        # proxy_read_timeout 默认 60s，会把空闲的探针连接掐断，
        # 前端表现为延迟曲线每分钟断一次。设成 1 小时留足余量。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        # 回源建连要快速失败: 家里线路断了应当立刻报错，而不是让页面转圈。
        proxy_connect_timeout 5s;

        # 关缓冲: 探针要的是即时到达，nginx 攒包会把测出来的延迟做脏。
        proxy_buffering off;
    }

    # 这个 vhost 只对外提供 /probe，其余路径不暴露任何东西，
    # 避免被当成通用入口去扫。
    location / {
        return 404;
    }
}
