# 线路延迟探针的 wss 入口 —— 各 frp 节点 /etc/nginx/conf.d/probe-<线路id>.conf
#
# 这是 2026-08-14 实际部署到五台节点并验证通过的版本（返回 101 Switching Protocols）。
# 把 <DOMAIN> 换成本节点的线路域名（如 hangzhou1.mcwok.cn），<SLUG> 换成线路 id。
#
# 探针本体是 mod 内置的 WebSocket 回显服务，经 frp 隧道暴露在本机 127.0.0.1:25610。
# 该端口不对公网开放，外部一律走这里的 443 终结 TLS 后反代进去。
#
# 两个踩过的坑：
#
# 1. 不要写 `http2 on;`。那是 nginx 1.25.1 起的语法，这些机器是 Ubuntu 24.04 自带的
#    1.24.0，会直接 `unknown directive "http2"` 拒绝整份配置。而且浏览器的 WebSocket
#    无论如何都走 HTTP/1.1 升级，对探针这种单连接小包场景 http2 没有任何收益，
#    干脆不开。
#
# 2. map 变量名要带命名空间。nginx 遇到重复的 map 名会拒绝启动，而这些节点上还跑着
#    别的站点（深圳有面板、广州有问卷），随手叫 $connection_upgrade 很容易撞车。
#
# 签发证书用 certbot --webroot（不要 --standalone）：这些节点的 80/443 上跑着其它站点，
# standalone 要独占 80，会把它们打断。

map $http_upgrade $mcwok_probe_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    # 证书续期走 HTTP-01，这个 location 必须一直留着
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <DOMAIN>;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:probe_<SLUG>:1m;
    ssl_session_timeout 10m;

    location /probe {
        proxy_pass http://127.0.0.1:25610;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mcwok_probe_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 探针是长连接，默认 60s 读超时会在测量中途把它掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 探针消息以毫秒计，任何缓冲都会污染测量结果
        proxy_buffering off;
        tcp_nodelay on;
    }

    # 这个 vhost 只提供探针，其余路径不响应
    location / {
        return 404;
    }
}
