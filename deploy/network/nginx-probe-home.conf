# nginx 反向代理 —— 家宽直连线路 (xiamen) 的 WebSocket 探针 TLS 终结
#
# 部署位置: Minecraft 主机 192.168.10.200 自身, 路径 /etc/nginx/conf.d/probe-home.conf
#
# 数据路径:
#   浏览器 --wss:8443--> OpenWrt DNAT --> 192.168.10.200:8443 nginx --http/1.1--> 127.0.0.1:25610
#
# 与节点上的 nginx-probe.conf 的区别: 那份反代的是 frps 暴露出来的端口 (隧道对端在家里),
# 这份反代的是本机探针, 中间没有任何隧道。因此不存在"必须用防火墙锁 25610"的问题 ——
# 探针本来就只监听回环, 只要不在 OpenWrt 上映射 25610 就不会外泄。
#
# ---- 两处偏离标准做法, 都是被外部条件逼的 ----
#
# 1. 端口是 8443 而非 443。厦门联通对家宽入站封掉了 80/443/8080/53, 高位端口放行。
#    443 收不到包, 于是探针和上海节点一样落在 8443 (那台是因为 443 被 WB_APP 业务占着,
#    原因不同, 结果一样)。mod 侧的 probe-url 必须显式带上 :8443。
#
# 2. 域名是 home.shinoyuki.cn 而非 *.mcwok.cn。这不只是命名偏好, 是证书能否自动续期的分水岭:
#    mcwok.cn 的解析在另一个阿里云账号下, 手上的 AccessKey 写不了它的 TXT 记录
#    (调用返回 IncorrectDomainUser), 而家宽这条线 80 端口被封, HTTP-01 也走不通 ——
#    两条自动化路径同时堵死, 只剩手工加 TXT。shinoyuki.cn 在自己账号下, DNS-01 全自动,
#    顺带让 DDNS 和证书共用同一条记录: 公网 IP 变了, 两边一起跟随, 无需人工干预。
#
#    上海节点就是反面教材 —— 挂在 mcwok.cn 下, 2026-10-12 那次自动续期注定失败。
#
# ---- 前置: 签发证书 ----
#   acme.sh --issue --dns dns_ali -d home.shinoyuki.cn --server letsencrypt
#   acme.sh --install-cert -d home.shinoyuki.cn \
#           --key-file       /etc/ssl/mcwok-probe/home.shinoyuki.cn.key \
#           --fullchain-file /etc/ssl/mcwok-probe/home.shinoyuki.cn.crt \
#           --reloadcmd      "systemctl reload nginx"
#
# 需要 Ali_Key / Ali_Secret 两个环境变量 (shinoyuki.cn 所属账号的 AccessKey)。
# acme.sh 首次签发后会把它们存进 ~/.acme.sh/account.conf 供续期复用。
# DNS-01 不依赖任何入站端口, 所以签发这一步在端口映射配好之前就能完成。

# 变量名带命名空间前缀: nginx 里重复定义同名 map 会直接拒绝启动,
# 这台机器以后若再挂别的站点, 不带前缀迟早撞车。
map $http_upgrade $mcwok_probe_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;

    server_name home.shinoyuki.cn;

    # 不开 http2: 浏览器的 WebSocket 一律走 HTTP/1.1 升级, 开了也用不上。
    ssl_certificate     /etc/ssl/mcwok-probe/home.shinoyuki.cn.crt;
    ssl_certificate_key /etc/ssl/mcwok-probe/home.shinoyuki.cn.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:PROBEHOME_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location /probe {
        proxy_pass http://127.0.0.1:25610;

        # 以下四行缺一不可: nginx 默认用 HTTP/1.0 回源,
        # 而 Upgrade 机制是 HTTP/1.1 才有的, 少一行 WebSocket 握手就失败。
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $mcwok_probe_upgrade;
        proxy_set_header Host       $host;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 默认 60s 会把空闲的探针长连接掐断, 前端表现为延迟曲线每分钟断一次。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 5s;

        # 关缓冲: 攒包会把测出来的延迟做脏。
        proxy_buffering off;
        tcp_nodelay on;
    }

    location / {
        return 404;
    }
}
