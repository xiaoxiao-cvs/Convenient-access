# nginx 反向代理 —— 家宽直连线路的 WebSocket 探针 TLS 终结（Caddy 的备选方案）
#
# ============================================================================
# 家宽直连线路，最后接入
# ============================================================================
# 本文件是 Caddyfile-home 的替代品，**二选一，不要同时部署**：两者都要监听
# 443，同时起会导致后启动的那个 bind 失败。
#
# 优先推荐 Caddy（配置更短、ACME 内建），只有在不想引入 Caddy、
# 或这台机器上已经跑着 nginx 的情况下才用本文件。
#
# 部署路径: /etc/nginx/conf.d/probe-home.conf
#
# 数据路径:
#   浏览器 --wss--> 家里:443 nginx --http/1.1--> 家里:127.0.0.1:25610（mod 内置探针）
#
# 与节点上的 nginx-probe.conf 的区别:
#   节点那份反代的是 frps 暴露出来的端口（隧道对端在家里）；
#   本文件反代的是**本机**的探针，中间没有任何隧道。
#   因此这里不存在"必须防火墙锁 25610"的问题 —— 探针本来就只监听回环，
#   只要不在路由器上映射 25610 就不会外泄。
#
# ---- 前置: 证书 ----
# 用 issue-wildcard-cert.sh 在这台机器上签一次 *.mcwok.cn，
# 或者直接把节点上签好的证书拷过来（泛域名证书同样覆盖 home.mcwok.cn）。
# 拷贝的话要记得两边的续期是各管各的，节点续期了不会自动同步到家里，
# 更稳妥的做法还是在本机独立跑一次 issue-wildcard-cert.sh。
#
# 家宽 80 端口通常被运营商封，HTTP-01 走不通，必须走 DNS-01 ——
# issue-wildcard-cert.sh 用的就是 DNS-01，直接可用。

# 见 nginx-probe.conf 的说明: 变量名带 probe_ 前缀避免与本机其它站点的
# 同名 map 撞车，nginx 里重复定义同名 map 会直接拒绝启动。
map $http_upgrade $probe_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name home.mcwok.cn;

    # 路径与 issue-wildcard-cert.sh 里 --install-cert 的参数保持一致。
    ssl_certificate     /etc/nginx/ssl/mcwok.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mcwok.cn/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:PROBEHOME_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location /probe {
        proxy_pass http://127.0.0.1:25610;

        # 以下四行缺一不可: nginx 默认用 HTTP/1.0 回源，
        # 而 Upgrade 机制是 HTTP/1.1 才有的，少一行 WebSocket 握手就失败。
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $probe_connection_upgrade;
        proxy_set_header Host       $host;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 默认 60s 会把空闲的探针长连接掐断，前端表现为延迟曲线每分钟断一次。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 5s;

        # 关缓冲: 攒包会把测出来的延迟做脏。
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
