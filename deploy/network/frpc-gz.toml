# frpc 客户端配置 —— gz 线路（家里 -> 阿里云广州节点）
#
# 适用版本: frp v0.52 及以上的 TOML 格式（本文件按 v0.70.1 的字段名编写）。
#
# 一个 frpc 进程只能连接一个 frps。要同时接入 gz 和 sz 两个节点，
# 家里必须跑两个互相独立的 frpc 进程，各自吃一份配置文件。
# 详见 README.md「为什么是两个 frpc 实例」。
#
# 部署路径: Linux 为 /etc/frp/frpc-gz.toml；Windows 见 README.md 的 nssm 一节。

serverAddr = "8.148.217.146"
serverPort = 7000

# 这里刻意写 IP 而不是 gz.mcwok.cn: 节点公网 IP 是静态的，
# 而 DNS 一旦解析异常（域名过期被切 expire NS 之类）会把线路一起带下线。
# 隧道本身不需要域名，域名只给玩家用。

auth.method = "token"
# 占位符: 必须与 frps-gz.toml 中的 auth.token 完全一致。
auth.token = "<FRP_TOKEN>"

# token 写错或节点暂时不可达时不要退出进程，交给 frpc 自身无限重试。
# 退出会让 systemd/nssm 反复拉起，日志被登录失败刷满，反而更难定位。
loginFailExit = false

transport.protocol = "tcp"
transport.tls.enable = true

# 预建 5 条工作连接，玩家进服时省掉一次广州往返的 TCP 建连 RTT。
# 不得超过 frps 侧的 transport.maxPoolCount。
transport.poolCount = 5

# frpc 的本地管理接口，供 frpc reload / frpc status 使用。
# 两个 frpc 实例跑在同一台机器上，必须用不同端口，否则第二个实例起不来。
# gz 用 7400，sz 用 7401。
webServer.addr = "127.0.0.1"
webServer.port = 7400
webServer.user = "admin"
# 占位符: 替换成真实密码。
webServer.password = "<FRPC_ADMIN_PASSWORD>"

log.to = "./frpc-gz.log"
log.level = "info"
log.maxDays = 7
log.disablePrintColor = true

# ---- Minecraft 主线路 ----
[[proxies]]
name = "mc-gz"
type = "tcp"
# frpc 与 Minecraft 服务端跑在同一台机器上，转发器只监听本地口。
# 若把 frpc 挪到家里另一台机器，这里要改成 MC 主机的内网地址，
# 同时转发器也得改成监听 0.0.0.0。
localIP = "127.0.0.1"
localPort = 25601
remotePort = 25565

# PROXY protocol v2: 隧道会把源地址改写成 frpc 的本机地址，不带这个头，
# Minecraft 侧看到的所有玩家 IP 都是回环地址，白名单审计日志会整表作废。
#
# 转发器不需要为此配任何开关: 它对每条新连接先探测 PROXY 头，认得出就吃掉并取回
# 真实地址，认不出就按直连处理。所以这一项开与不开都能正常进服，区别只在审计日志
# 里记的是真实 IP 还是回环地址。
#
# 线路归属不依赖这个头 —— 那是按玩家从哪个入口端口进来判定的，与 PROXY protocol 无关。
transport.proxyProtocolVersion = "v2"

# 不叠加 frp 自己的加密: 外层 transport.tls.enable 已经加密了整条隧道，
# 再套一层只是白白吃 CPU 和延迟。
transport.useEncryption = false
# 不压缩: Minecraft 协议自身超过阈值就已经 zlib 压缩过，
# 二次压缩几乎没有收益，只增加每个包的处理延迟。
transport.useCompression = false

# 转发器没起来时让 frps 主动摘掉这条 proxy，
# 玩家会立刻收到连接拒绝而不是连上去卡在"正在登录"。
healthCheck.type = "tcp"
healthCheck.timeoutSeconds = 3
healthCheck.maxFailed = 3
healthCheck.intervalSeconds = 10

# ---- 延迟探针 ----
[[proxies]]
name = "probe-gz"
type = "tcp"
localIP = "127.0.0.1"
localPort = 25610
remotePort = 25610

# 这条刻意不开 PROXY protocol。探针只实现了 WebSocket 升级握手，完全不解析 PROXY 头;
# 一旦开启，frpc 先发的那段二进制头会被当成 HTTP 请求行读进去，永远等不到请求头结束标记，
# 握手必然失败。探针也不需要来源 IP，它只测往返延迟。
transport.useEncryption = false
transport.useCompression = false
