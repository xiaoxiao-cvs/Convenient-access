plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    // 把第三方依赖打进 mod jar (ForgeGradle 的 implementation 不会嵌入运行期 classpath)
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

// v2 迁移期间，旧 Bukkit 代码暂留作为复用层参考，但不进编译路径
// 后续 commit 会按子模块逐步迁到 com.shinoyuki.accesshub.*，全部搬完后移除此 exclude
sourceSets.main.java {
    exclude 'com/xaoxiao/**'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // Spark API (性能监测, 软依赖, 由服务器安装的 spark mod 在运行期提供)
    maven {
        name = 'lucko'
        url = 'https://repo.lucko.me/'
        content { includeGroup 'me.lucko' }
    }
}

configurations {
    // shade 里的依赖会被 shadowJar 打进最终 jar; extendsFrom 让它们同时进编译 classpath
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // HTTP 服务器栈 (后台管理 API 入口) — 必须 shade 进 jar, Forge 运行期不提供
    shade 'org.eclipse.jetty:jetty-server:11.0.20'
    shade 'org.eclipse.jetty:jetty-servlet:11.0.20'
    shade 'jakarta.servlet:jakarta.servlet-api:5.0.0'

    // 持久化 (SQLite 单文件) — 必须 shade 进 jar, 含各平台原生库
    shade 'org.xerial:sqlite-jdbc:3.42.0.0'

    // Night Config: Forge 1.20.1 自带 3.6.4 (传递依赖), 运行期已在 classpath。
    // 用 compileOnly 显式声明编译期可见, 不打包 (避免与 Forge 版本冲突)。
    compileOnly 'com.electronwill.night-config:core:3.6.4'
    compileOnly 'com.electronwill.night-config:toml:3.6.4'

    // Spark API (软依赖): 仅编译期可见, 不打包。运行期由服务器安装的 spark mod 提供;
    // 未安装时 SparkIntegration 经 ModList.isLoaded 检测后降级为 JVM MXBean fallback。
    compileOnly 'me.lucko:spark-api:0.1-SNAPSHOT'

    // Forge 1.20.1 自带 Gson 与 SLF4J，无需声明
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    // 原始 dev jar (Mojmap, 不含依赖), 不作为发布产物
    archiveClassifier = 'dev'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Version'   : '1',
                'Specification-Vendor'    : mod_authors,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// fat jar: 合并 shade 依赖 + mod 类。archiveClassifier='' 使其成为主产物 shinoyuki_accesshub-<ver>.jar
tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    archiveClassifier = ''
    configurations = [project.configurations.shade]

    // 只 relocate Jetty: 自包含、避免与其它 mod 的 HTTP 栈冲突。
    // 不 relocate org.sqlite: sqlite-jdbc 按包路径加载 org/sqlite/native/** 原生库, relocate 会破坏。
    // 不 relocate jakarta.servlet: 无其它 provider, 无冲突风险。
    relocate 'org.eclipse.jetty', 'com.shinoyuki.accesshub.libs.jetty'

    // 合并 META-INF/services (Jetty 的 ServiceLoader 文件 + sqlite 的 java.sql.Driver), 否则被覆盖丢失
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    // 剔除 Forge 已自带的 slf4j (Jetty 传递依赖带入): 否则 fat jar 与 Forge 的 org.slf4j 模块
    // 重复导出同名包, 触发 JPMS ResolutionException 致服务器无法启动。
    // 注: 仅从输出 jar 剔除 (文件级 exclude), slf4j 仍在编译 classpath (Forge 提供), 不影响编译。
    exclude 'org/slf4j/**'
    // 剔除 jetty-http 捆绑的 javax/servlet 遗留 XML schema 资源 (.xsd/.dtd, 无 .class):
    // 纯编程式用 jetty 不需要, 避免 Forge SecureJar 对资源目录的潜在边界问题 + 去 bloat。
    exclude 'javax/servlet/**'
    // 剔除被 shade 库带入的 module-info (JPMS 在 Forge 模块层下会冲突, 且对 fat jar 无意义)
    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'

    manifest.inheritFrom tasks.jar.manifest
}

// 关键: 对 shadowJar 产物执行 reobf (Mojmap -> SRG), 否则生产环境 MC API 调用映射错乱。
// 第三方依赖类无 MC 引用, reobf 原样放行。生成 reobfShadowJar 任务。
reobf {
    shadowJar {}
}

tasks.named('assemble').configure {
    dependsOn tasks.named('reobfShadowJar')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.shadowJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
