modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/xiaoxiao-cvs/Convenient-access/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# 软依赖: spark 性能监测 mod。装了则 /api/v1/server/performance 提供 Spark 详细数据,
# 未装则降级为 JVM 基础数据。ordering=AFTER 保证 spark 先于本 mod 加载。
[[dependencies.${mod_id}]]
    modId = "spark"
    mandatory = false
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"
